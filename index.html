<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catatan Order Minuman</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c12;
    --surface: #13151f;
    --card: #1b1e2e;
    --border: #252839;
    --accent: #38e07b;
    --accent2: #22c55e;
    --accent-dim: rgba(56,224,123,0.12);
    --text: #eef0f6;
    --muted: #6b7090;
    --danger: #ff6b6b;
    --input-bg: #0e1018;
    --radius: 14px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 0 80px;
  }

  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 50;
  }
  .topbar-brand { display: flex; align-items: center; gap: 10px; }
  .topbar-brand .emoji { font-size: 1.4rem; }
  .topbar-brand h1 { font-size: 0.95rem; font-weight: 800; letter-spacing: -0.3px; line-height: 1.1; }
  .topbar-brand p { font-size: 0.7rem; color: var(--muted); }

  .btn-login {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 50px;
    color: var(--muted);
    font-family: inherit;
    font-size: 0.75rem; font-weight: 600;
    padding: 7px 14px;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    transition: all 0.2s;
  }
  .btn-login:hover { border-color: var(--accent); color: var(--accent); }
  .btn-login.logged { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); transition: all 0.2s; }
  .btn-login.logged .dot { background: var(--accent); box-shadow: 0 0 6px var(--accent); }

  .wrap { max-width: 440px; margin: 0 auto; padding: 20px 16px; }

  .field { margin-bottom: 14px; }
  label {
    display: block;
    font-size: 0.72rem; font-weight: 700;
    color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.8px;
    margin-bottom: 6px;
  }

  .input-base {
    width: 100%;
    background: var(--input-bg);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: inherit;
    font-size: 0.92rem;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.2s;
    appearance: none; -webkit-appearance: none;
  }
  .input-base:focus { border-color: var(--accent); }

  .select-wrap { position: relative; }
  .select-wrap::after {
    content: '▾'; position: absolute;
    right: 14px; top: 50%; transform: translateY(-50%);
    color: var(--muted); pointer-events: none;
  }
  .select-wrap select { padding-right: 36px; cursor: pointer; }

  input[type="number"] {
    width: 100%; background: var(--input-bg);
    border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text); font-family: inherit;
    font-size: 0.92rem; padding: 12px 14px;
    outline: none; text-align: center;
    transition: border-color 0.2s;
    -moz-appearance: textfield;
  }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
  input[type="number"]:focus { border-color: var(--accent); }

  .qty-row { display: flex; gap: 8px; align-items: center; }
  .qty-btn {
    width: 46px; height: 46px; flex-shrink: 0;
    background: var(--card); border: 1.5px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text);
    font-size: 1.3rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .qty-btn:hover { background: var(--accent); color: #0a0c12; border-color: var(--accent); }



  .btn-submit {
    width: 100%; padding: 15px;
    background: var(--accent); color: #0a0c12;
    border: none; border-radius: var(--radius);
    font-family: inherit; font-size: 0.95rem; font-weight: 800;
    cursor: pointer; transition: all 0.2s; margin-top: 4px;
  }
  .btn-submit:hover { background: var(--accent2); transform: translateY(-1px); }
  .btn-submit:active { transform: scale(0.98); }
  .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* REKAP PANEL */
  .rekap-panel {
    position: fixed; inset: 0;
    background: var(--bg);
    z-index: 100;
    display: none; flex-direction: column;
    overflow: hidden;
  }
  .rekap-panel.show { display: flex; }

  .rekap-topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .rekap-topbar h2 { font-size: 0.95rem; font-weight: 800; }
  .rekap-actions { display: flex; gap: 8px; align-items: center; }

  .btn-export {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--accent);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 0.75rem; font-weight: 700;
    padding: 7px 13px; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    transition: all 0.2s;
  }
  .btn-export:hover { border-color: var(--accent); }

  .btn-tutup-rekap {
    background: none; border: 1px solid var(--border);
    color: var(--muted); border-radius: var(--radius-sm);
    font-family: inherit; font-size: 0.75rem; font-weight: 600;
    padding: 7px 13px; cursor: pointer; transition: all 0.2s;
  }
  .btn-tutup-rekap:hover { border-color: var(--danger); color: var(--danger); }

  .rekap-scroll {
    flex: 1; overflow-y: auto;
    padding: 16px;
  }
  .rekap-wrap { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

  .bulan-block {}
  .bulan-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px;
    background: var(--accent);
    border-radius: var(--radius) var(--radius) 0 0;
  }
  .bulan-head span { font-size: 0.85rem; font-weight: 800; color: #0a0c12; }

  .bulan-body {
    background: var(--card);
    border: 1px solid var(--border); border-top: none;
    border-radius: 0 0 var(--radius) var(--radius);
    overflow: hidden;
  }

  .person-row { border-bottom: 1px solid var(--border); cursor: pointer; }
  .person-row:last-child { border-bottom: none; }

  .person-summary {
    display: flex; justify-content: space-between; align-items: center;
    padding: 13px 16px; transition: background 0.15s;
  }
  .person-row:hover .person-summary { background: var(--input-bg); }
  .ps-name { font-size: 0.88rem; font-weight: 700; }
  .ps-meta { font-size: 0.73rem; color: var(--muted); margin-top: 2px; }
  .ps-total { font-size: 0.92rem; font-weight: 800; color: var(--accent); }
  .ps-arr { font-size: 0.65rem; color: var(--muted); display: block; text-align: right; margin-top: 2px; transition: transform 0.2s; }
  .person-row.open .ps-arr { transform: rotate(180deg); }

  .person-orders {
    display: none;
    background: var(--bg);
    border-top: 1px solid var(--border);
    padding: 10px; flex-direction: column; gap: 7px;
  }
  .person-row.open .person-orders { display: flex; }

  .order-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px 13px;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .oc-name { font-size: 0.85rem; font-weight: 600; }
  .oc-meta { font-size: 0.72rem; color: var(--muted); margin-top: 3px; }
  .oc-qty { display: inline-block; background: var(--border); border-radius: 4px; padding: 1px 6px; font-size: 0.7rem; color: var(--text); margin-right: 4px; }
  .oc-price { font-size: 0.88rem; font-weight: 700; color: var(--accent); flex-shrink: 0; }
  .oc-price.dash { color: var(--muted); font-weight: 400; font-size: 0.78rem; }

  /* TOAST */
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--accent); color: #0a0c12;
    padding: 11px 22px; border-radius: 50px;
    font-size: 0.82rem; font-weight: 700;
    transition: transform 0.3s ease; z-index: 9999; white-space: nowrap;
    box-shadow: 0 4px 20px rgba(56,224,123,0.3);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--danger); color: white; box-shadow: 0 4px 20px rgba(255,107,107,0.3); }

  /* LOGIN OVERLAY */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    display: none; align-items: center; justify-content: center;
    z-index: 200; padding: 24px;
    backdrop-filter: blur(4px);
  }
  .overlay.show { display: flex; }
  .login-box {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 20px; padding: 32px 24px;
    width: 100%; max-width: 320px; text-align: center;
  }
  .login-box .lock { font-size: 2rem; margin-bottom: 12px; display: block; }
  .login-box h2 { font-size: 1.05rem; font-weight: 800; margin-bottom: 4px; }
  .login-box p { font-size: 0.8rem; color: var(--muted); margin-bottom: 20px; }

  .pw-wrap { position: relative; margin-bottom: 12px; }
  .pw-wrap input {
    width: 100%; background: var(--input-bg);
    border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text); font-family: inherit;
    font-size: 1rem; padding: 12px 44px 12px 14px;
    outline: none; letter-spacing: 3px; transition: border-color 0.2s;
  }
  .pw-wrap input:focus { border-color: var(--accent); }
  .pw-wrap input::placeholder { letter-spacing: 1px; }
  .pw-toggle {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; color: var(--muted);
    display: flex; align-items: center;
  }
  .btn-masuk {
    width: 100%; padding: 13px;
    background: var(--accent); color: #0a0c12;
    border: none; border-radius: var(--radius-sm);
    font-family: inherit; font-size: 0.9rem; font-weight: 800;
    cursor: pointer; transition: background 0.2s;
  }
  .btn-masuk:hover { background: var(--accent2); }
  .btn-keluar {
    width: 100%; padding: 13px;
    background: none; color: var(--danger);
    border: 1px solid var(--danger); border-radius: var(--radius-sm);
    font-family: inherit; font-size: 0.9rem; font-weight: 700;
    cursor: pointer; transition: all 0.2s; margin-bottom: 8px;
  }
  .btn-keluar:hover { background: rgba(255,107,107,0.1); }
  .login-err { font-size: 0.78rem; color: var(--danger); margin-top: 8px; min-height: 18px; }
  .btn-close-overlay {
    background: none; border: none; color: var(--muted);
    font-family: inherit; font-size: 0.78rem; cursor: pointer;
    margin-top: 12px; display: block; width: 100%;
  }
  .btn-close-overlay:hover { color: var(--text); }

  .empty { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 40px 0; }
  .loading { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 40px 0; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* ── 3D GAME EFFECTS ── */
  /* Tilt wrapper untuk form */
  .wrap { transform-style: preserve-3d; }

  .success-overlay {
    position: fixed; inset: 0; z-index: 300;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0);
    pointer-events: none;
    transition: background 0.35s ease;
  }
  .success-overlay.show {
    pointer-events: auto;
    background: rgba(0,5,15,0.75);
    backdrop-filter: blur(12px) saturate(1.4);
  }

  /* 3D scene container */
  .scene-3d {
    perspective: 900px;
    transform-style: preserve-3d;
  }

  .success-card {
    background: linear-gradient(145deg, #1e2235 0%, #13151f 60%, #0e1220 100%);
    border: 1.5px solid rgba(56,224,123,0.5);
    border-radius: 28px; padding: 42px 30px;
    text-align: center; max-width: 300px; width: 90%;
    transform: perspective(900px) rotateX(40deg) scale(0.6);
    opacity: 0;
    transition:
      transform 0.55s cubic-bezier(0.34,1.46,0.64,1),
      opacity 0.35s ease;
    box-shadow:
      0 0 0 1px rgba(56,224,123,0.1),
      0 30px 80px rgba(0,0,0,0.6),
      0 0 60px rgba(56,224,123,0.15),
      inset 0 1px 0 rgba(255,255,255,0.06);
    position: relative; overflow: hidden;
    transform-style: preserve-3d;
  }

  /* glass shimmer stripe */
  .success-card::before {
    content: '';
    position: absolute; top: 0; left: -60%;
    width: 50%; height: 100%;
    background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.04) 50%, transparent 60%);
    animation: shimmer 3s infinite 1s;
  }
  @keyframes shimmer { 0%{left:-60%} 100%{left:130%} }

  /* glowing border ring */
  .success-card::after {
    content: '';
    position: absolute; inset: -1px;
    border-radius: 28px;
    background: linear-gradient(135deg, rgba(56,224,123,0.4), transparent 50%, rgba(56,224,123,0.2));
    z-index: -1;
    animation: ringRotate 4s linear infinite;
  }
  @keyframes ringRotate { to { filter: hue-rotate(60deg); } }

  .success-overlay.show .success-card {
    transform: perspective(900px) rotateX(0deg) scale(1);
    opacity: 1;
  }

  /* floating icon */
  .big-icon-wrap {
    display: block; margin-bottom: 12px;
    animation: float3d 3s ease-in-out infinite 0.6s;
    transform-style: preserve-3d;
    filter: drop-shadow(0 10px 20px rgba(56,224,123,0.4));
  }
  .big-icon-wrap .big-icon { font-size: 3.8rem; }
  @keyframes float3d {
    0%,100% { transform: translateY(0) rotateY(0deg); }
    30%     { transform: translateY(-8px) rotateY(15deg); }
    70%     { transform: translateY(-5px) rotateY(-10deg); }
  }

  .success-card h3 {
    font-size: 1.15rem; font-weight: 800; color: var(--accent); margin-bottom: 8px;
    text-shadow: 0 0 20px rgba(56,224,123,0.5);
    animation: popIn 0.4s 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .success-card .order-info {
    font-size: 0.83rem; color: var(--muted); line-height: 1.7;
    animation: popIn 0.4s 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .success-card .order-info strong { color: var(--text); }

  .xp-row {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; margin-top: 18px;
  }
  .xp-badge {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--accent); color: #0a0c12;
    font-size: 0.78rem; font-weight: 800;
    padding: 6px 14px; border-radius: 50px;
    box-shadow: 0 4px 20px rgba(56,224,123,0.4);
    animation: popIn3d 0.5s 0.55s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .streak-badge {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(255,209,102,0.12); color: var(--warn);
    border: 1px solid rgba(255,209,102,0.3);
    font-size: 0.78rem; font-weight: 800;
    padding: 6px 14px; border-radius: 50px;
    animation: popIn3d 0.5s 0.7s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  @keyframes popIn {
    0%  { transform: scale(0) translateY(10px); opacity:0; }
    100%{ transform: scale(1) translateY(0); opacity:1; }
  }
  @keyframes popIn3d {
    0%  { transform: scale(0) perspective(400px) rotateX(-60deg); opacity:0; }
    100%{ transform: scale(1) perspective(400px) rotateX(0deg); opacity:1; }
  }

  .btn-ok {
    margin-top: 22px; padding: 13px 36px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    color: #0a0c12; border: none; border-radius: 50px;
    font-family: inherit; font-size: 0.9rem; font-weight: 800;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(56,224,123,0.35), 0 2px 0 rgba(0,0,0,0.3);
    transition: all 0.2s;
    animation: popIn3d 0.5s 0.85s cubic-bezier(0.34,1.56,0.64,1) both;
    transform-style: preserve-3d;
  }
  .btn-ok:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 12px 32px rgba(56,224,123,0.45);
  }
  .btn-ok:active { transform: translateY(1px) scale(0.97); }

  /* 3D Confetti */
  .confetti-wrap { position: fixed; inset: 0; pointer-events: none; z-index: 299; overflow: hidden; }
  .confetti-piece {
    position: absolute; top: -16px;
    animation: confettiFall3d linear forwards;
    transform-style: preserve-3d;
  }
  @keyframes confettiFall3d {
    0%   { transform: translateY(0) translateZ(0) rotateX(0) rotateY(0) rotateZ(0); opacity:1; }
    25%  { transform: translateY(25vh) translateZ(30px) rotateX(180deg) rotateY(90deg) rotateZ(120deg); }
    75%  { transform: translateY(75vh) translateZ(-20px) rotateX(360deg) rotateY(270deg) rotateZ(300deg); opacity:0.8; }
    100% { transform: translateY(108vh) translateZ(0) rotateX(540deg) rotateY(360deg) rotateZ(480deg); opacity:0; }
  }

  /* 3D ripple on submit btn */
  @keyframes ripple3d {
    0%   { transform: scale(1); box-shadow: 0 0 0 0 rgba(56,224,123,0.4); }
    50%  { transform: scale(0.97); }
    100% { transform: scale(1); box-shadow: 0 0 0 18px rgba(56,224,123,0); }
  }
  .btn-submit:not(:disabled):active { animation: ripple3d 0.5s ease; }

  /* shake */
  @keyframes shake {
    0%,100%{transform:translateX(0) rotateZ(0)} 
    20%{transform:translateX(-8px) rotateZ(-1deg)} 
    40%{transform:translateX(8px) rotateZ(1deg)} 
    60%{transform:translateX(-5px) rotateZ(-0.5deg)} 
    80%{transform:translateX(5px) rotateZ(0.5deg)}
  }
  .shake { animation: shake 0.45s ease; }

  /* 3D card tilt on form inputs */
  .input-base, .qty-btn, .btn-submit {
    transition: transform 0.15s ease, border-color 0.2s, box-shadow 0.2s;
  }
  .input-base:focus {
    transform: translateZ(4px) scale(1.01);
    box-shadow: 0 4px 20px rgba(56,224,123,0.12);
  }
  .btn-submit:hover {
    transform: translateY(-2px) scale(1.01);
    box-shadow: 0 8px 30px rgba(56,224,123,0.25);
  }
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-brand">
    <span class="emoji">🧋</span>
    <div>
      <h1>Order Minuman</h1>
      <p>Bidang Perumahan · DPRKP Ngawi</p>
    </div>
  </div>
  <button class="btn-login" id="btn-login" onclick="bukaLogin()">
    <span class="dot" id="dot"></span>
    <span id="login-label">Rekap</span>
  </button>
</div>

<!-- FORM -->
<div class="wrap">
  <div class="field">
    <label>Nama</label>
    <div class="select-wrap">
      <select id="nama" class="input-base">
        <option value="">-- Pilih Nama --</option>
        <option>Bu Tiwi</option>
        <option>Bu Etiek</option>
        <option>Bu Yuni</option>
        <option>Pak Wahyudhi</option>
        <option>Mas Dika</option>
        <option>Mas Hari</option>
        <option>Mbak Reza</option>
        <option>Fauzi</option>
        <option>Aca</option>
        <option>Erma</option>
        <option>Mbak Dian</option>
        <option>Mbak Riri</option>
        <option>Mbak Mas Yunan</option>
      </select>
    </div>
  </div>

  <div class="field">
    <label>Minuman</label>
    <div class="select-wrap">
      <select id="minuman" class="input-base" onchange="onMinumanChange()">
        <option value="">-- Pilih Minuman --</option>
        <option data-harga="3000">Es Teh</option>
        <option data-harga="3000">Teh Hangat</option>
        <option data-harga="4000">Kopi</option>
        <option data-harga="4000">Es Jeruk</option>
        <option data-harga="4000">Jeruk Anget</option>
        <option data-harga="5000">Cappucino</option>
        <option data-harga="5000">Good Day</option>
        <option data-harga="1000">Kerupuk</option>
        <option data-harga="1000">Gorengan</option>
        <option data-harga="" value="Lainnya">Lainnya...</option>
      </select>
    </div>
    <div id="lainnya-wrap" style="display:none;margin-top:8px">
      <input type="text" id="minuman-lain" class="input-base" placeholder="Tulis nama minuman...">
    </div>
  </div>

  <div class="field">
    <label>Jumlah</label>
    <div class="qty-row">
      <button class="qty-btn" onclick="ubahJumlah(-1)">−</button>
      <input type="number" id="jumlah" value="1" min="1" max="99">
      <button class="qty-btn" onclick="ubahJumlah(1)">+</button>
    </div>
  </div>

  <div class="field">
    <label>Tanggal Beli</label>
    <input type="date" id="tanggal" class="input-base">
  </div>

  <button class="btn-submit" id="btn-submit" onclick="submitOrder()">Catat Pesanan</button>
</div>

<!-- REKAP PANEL (fullscreen, hanya muncul setelah login) -->
<div class="rekap-panel" id="rekap-panel">
  <div class="rekap-topbar">
    <h2>📊 Rekap Order</h2>
    <div class="rekap-actions">
      <button class="btn-export" onclick="exportExcel()">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export
      </button>
      <button class="btn-tutup-rekap" onclick="tutupRekap()">✕ Tutup</button>
    </div>
  </div>
  <div class="rekap-scroll">
    <div class="rekap-wrap" id="rekap-root">
      <div class="loading">Memuat data...</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- LOGIN OVERLAY -->
<div class="overlay" id="overlay">
  <div class="login-box">
    <span class="lock" id="lock-icon">🔒</span>
    <h2 id="login-title">Akses Rekap</h2>
    <p id="login-desc">Masukkan password untuk melihat rekap</p>

    <div id="login-form-wrap">
      <div class="pw-wrap">
        <input type="password" id="pw-input" placeholder="Password..." onkeydown="if(event.key==='Enter')doLogin()">
        <button class="pw-toggle" onclick="togglePw()" type="button">
          <svg id="pw-eye" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <button class="btn-masuk" onclick="doLogin()">Masuk</button>
      <div class="login-err" id="login-err"></div>
    </div>

    <div id="logout-wrap" style="display:none">
      <button class="btn-masuk" style="margin-bottom:10px" onclick="bukaRekap()">Lihat Rekap</button>
      <button class="btn-keluar" onclick="doLogout()">Keluar</button>
    </div>

    <button class="btn-close-overlay" onclick="tutupLogin()">Tutup</button>
  </div>
</div>

<script>
  const PASSWORD = "dprkp2026";
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzTWqt-W_aE85P4fezj0iIfBiSxK42s5Rg1nzCKD0GD-qpAqHO0lj3Nhgftr8fDAuWW/exec";
  const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const HARGA = { 'Es Teh':3000,'Teh Hangat':3000,'Kopi':4000,'Es Jeruk':4000,'Jeruk Anget':4000,'Cappucino':5000,'Good Day':5000,'Kerupuk':1000,'Gorengan':1000 };

  let isLoggedIn = false;
  let allData = null;

  document.getElementById('tanggal').value = new Date().toISOString().split('T')[0];

  // ── LOGIN ──
  function bukaLogin() {
    document.getElementById('overlay').classList.add('show');
    if (isLoggedIn) {
      document.getElementById('login-form-wrap').style.display = 'none';
      document.getElementById('logout-wrap').style.display = 'block';
      document.getElementById('lock-icon').textContent = '🔓';
      document.getElementById('login-title').textContent = 'Sudah Login';
      document.getElementById('login-desc').textContent = 'Kamu sudah bisa lihat rekap';
    } else {
      document.getElementById('login-form-wrap').style.display = 'block';
      document.getElementById('logout-wrap').style.display = 'none';
      document.getElementById('lock-icon').textContent = '🔒';
      document.getElementById('login-title').textContent = 'Akses Rekap';
      document.getElementById('login-desc').textContent = 'Masukkan password untuk melihat rekap';
      setTimeout(() => document.getElementById('pw-input').focus(), 100);
    }
  }

  function tutupLogin() {
    document.getElementById('overlay').classList.remove('show');
    document.getElementById('pw-input').value = '';
    document.getElementById('login-err').textContent = '';
  }

  function doLogin() {
    const val = document.getElementById('pw-input').value;
    if (val === PASSWORD) {
      isLoggedIn = true;
      document.getElementById('btn-login').classList.add('logged');
      document.getElementById('login-label').textContent = 'Rekap ✓';
      tutupLogin();
      bukaRekap();
    } else {
      document.getElementById('login-err').textContent = '❌ Password salah';
      document.getElementById('pw-input').value = '';
      document.getElementById('pw-input').focus();
    }
  }

  function doLogout() {
    isLoggedIn = false;
    allData = null;
    document.getElementById('btn-login').classList.remove('logged');
    document.getElementById('login-label').textContent = 'Rekap';
    tutupLogin();
    tutupRekap();
  }

  function togglePw() {
    const el = document.getElementById('pw-input');
    el.type = el.type === 'password' ? 'text' : 'password';
  }

  // ── REKAP PANEL ──
  function bukaRekap() {
    if (!isLoggedIn) { bukaLogin(); return; }
    tutupLogin();
    document.getElementById('rekap-panel').classList.add('show');
    loadRekap();
  }

  function tutupRekap() {
    document.getElementById('rekap-panel').classList.remove('show');
  }

  // ── FORM ──
  function onMinumanChange() {
    const val = document.getElementById('minuman').value;
    document.getElementById('lainnya-wrap').style.display = val === 'Lainnya' ? 'block' : 'none';
  }

  function ubahJumlah(d) {
    const el = document.getElementById('jumlah');
    el.value = Math.max(1, (parseInt(el.value) || 1) + d);
  }

  function showToast(msg, error = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (error ? ' error' : '');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  async function submitOrder() {
    const nama = document.getElementById('nama').value;
    const sel = document.getElementById('minuman').value;
    const lain = document.getElementById('minuman-lain').value.trim();
    const tanggal = document.getElementById('tanggal').value;
    const jumlah = parseInt(document.getElementById('jumlah').value) || 1;
    const minuman = sel === 'Lainnya' ? lain : sel;
    const harga = HARGA[minuman] || '';
    const total = harga ? harga * jumlah : '';

    if (!nama || !minuman || !tanggal) {
      showToast('⚠️ Lengkapi semua field dulu', true); return;
    }

    const btn = document.getElementById('btn-submit');
    btn.disabled = true; btn.textContent = 'Mengirim...';

    try {
      await fetch(SCRIPT_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tanggal, nama, minuman, jumlah, harga, total })
      });
      tampilkanSukses(nama, minuman, jumlah);
      document.getElementById('nama').value = '';
      document.getElementById('minuman').value = '';
      document.getElementById('minuman-lain').value = '';
      document.getElementById('jumlah').value = '1';
      document.getElementById('tanggal').value = new Date().toISOString().split('T')[0];
      document.getElementById('lainnya-wrap').style.display = 'none';
      allData = null;
    } catch(e) {
      showToast('❌ Gagal kirim, coba lagi', true);
    }

    btn.disabled = false; btn.textContent = 'Catat Pesanan';
  }

  // ── REKAP ──
  async function loadRekap() {
    if (allData) { renderRekap(); return; }
    document.getElementById('rekap-root').innerHTML = '<div class="loading">Memuat data...</div>';
    try {
      const res = await fetch(SCRIPT_URL);
      allData = await res.json();
      renderRekap();
    } catch(e) {
      document.getElementById('rekap-root').innerHTML = '<div class="empty">Gagal memuat data</div>';
    }
  }

  function rp(n) { return n ? 'Rp ' + Number(n).toLocaleString('id-ID') : '-'; }

  function renderRekap() {
    if (!allData || allData.length === 0) {
      document.getElementById('rekap-root').innerHTML = '<div class="empty">Belum ada data order</div>';
      return;
    }
    const perBulan = {};
    allData.forEach(row => {
      if (!row['Tanggal']) return;
      const d = new Date(row['Tanggal']);
      if (isNaN(d)) return;
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      if (!perBulan[key]) perBulan[key] = [];
      perBulan[key].push(row);
    });

    const html = Object.keys(perBulan).sort().reverse().map(key => {
      const [y, m] = key.split('-');
      const label = `${BULAN[parseInt(m)-1]} ${y}`;
      const rows = perBulan[key];
      const perOrang = {};
      let grandTotal = 0;
      rows.forEach(row => {
        const nama = row['Nama'] || '?';
        if (!perOrang[nama]) perOrang[nama] = { total: 0, orders: [] };
        const tot = Number(row['Total']) || 0;
        perOrang[nama].total += tot;
        perOrang[nama].orders.push(row);
        grandTotal += tot;
      });

      const personRows = Object.entries(perOrang)
        .sort((a,b) => b[1].total - a[1].total)
        .map(([nama, data], idx) => {
          const pid = `p-${key}-${idx}`;
          const totalOrders = data.orders.length;
          const totalItem = data.orders.reduce((s,r) => s + (Number(r['Jumlah'])||1), 0);
          const orderItems = [...data.orders].reverse().map(row => {
            const d2 = new Date(row['Tanggal']);
            const tgl = d2.toLocaleDateString('id-ID', { day:'numeric', month:'short' });
            const jml = Number(row['Jumlah']) || 1;
            const tot = Number(row['Total']);
            return `<div class="order-card">
              <div>
                <div class="oc-name">🧋 ${row['Minuman']||'-'}</div>
                <div class="oc-meta">${jml > 1 ? `<span class="oc-qty">✕${jml}</span>` : ''}📅 ${tgl}</div>
              </div>
              <div class="oc-price ${!tot?'dash':''}">${tot ? rp(tot) : '-'}</div>
            </div>`;
          }).join('');

          return `<div class="person-row" id="${pid}" onclick="togglePerson('${pid}')">
            <div class="person-summary">
              <div>
                <div class="ps-name">${nama}</div>
                <div class="ps-meta">${totalOrders} order · ${totalItem} item</div>
              </div>
              <div style="text-align:right">
                <div class="ps-total">${data.total > 0 ? rp(data.total) : '-'}</div>
                <span class="ps-arr">▾</span>
              </div>
            </div>
            <div class="person-orders">${orderItems}</div>
          </div>`;
        }).join('');

      return `<div class="bulan-block">
        <div class="bulan-head">
          <span>📅 ${label}</span>
          <span>${grandTotal > 0 ? rp(grandTotal) : '-'}</span>
        </div>
        <div class="bulan-body">${personRows}</div>
      </div>`;
    }).join('');

    document.getElementById('rekap-root').innerHTML = html;
  }

  function togglePerson(pid) {
    document.getElementById(pid).classList.toggle('open');
  }

  function exportExcel() {
    if (!allData || allData.length === 0) { showToast('Belum ada data', true); return; }
    const rows = [['Tanggal','Nama','Minuman','Jumlah','Harga','Total']];
    allData.forEach(r => rows.push([r['Tanggal']||'',r['Nama']||'',r['Minuman']||'',r['Jumlah']||'',r['Harga']||'',r['Total']||'']));
    const csv = '\uFEFF' + rows.map(row => row.map(val => {
      const s = String(val);
      return s.includes(',') || s.includes('"') || s.includes('\n') ? '"' + s.replace(/"/g,'""') + '"' : s;
    }).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `rekap-minuman-${new Date().toISOString().slice(0,10).replace(/-/g,'')}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('✅ File berhasil diunduh!');
  }


  // ── GAME EFFECTS ──
  let orderStreak = 0;
  let totalXP = 0;

  function tampilkanSukses(nama, minuman, jumlah) {
    orderStreak++;
    totalXP += 10;

    // Info di card
    document.getElementById('success-info').innerHTML =
      `<strong>${nama}</strong> memesan<br><strong>${jumlah > 1 ? jumlah + '× ' : ''}${minuman}</strong>`;
    document.getElementById('streak-badge').textContent = `🔥 ${orderStreak}x`;

    // Tampilkan overlay
    document.getElementById('success-overlay').classList.add('show');

    // Confetti
    buatConfetti();

    // Suara TTS "pesanan dicatat"
    ucapkan('Pesanan dicatat');
  }

  function tutupSuccess() {
    document.getElementById('success-overlay').classList.remove('show');
    bersihkanConfetti();
  }

  function ucapkan(teks) {
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(teks);
    utt.lang = 'id-ID';
    utt.rate = 0.95;
    utt.pitch = 1.1;
    utt.volume = 1;
    // Coba cari suara Indonesia
    const voices = speechSynthesis.getVoices();
    const idVoice = voices.find(v => v.lang.startsWith('id')) || voices.find(v => v.lang.startsWith('ms'));
    if (idVoice) utt.voice = idVoice;
    speechSynthesis.speak(utt);
  }
  // Preload voices (beberapa browser butuh trigger awal)
  if (window.speechSynthesis) {
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
  }

  const CONFETTI_COLORS = ['#38e07b','#22c55e','#ffd166','#ff6b6b','#a78bfa','#38bdf8','#fb923c','#f472b6'];
  const CONFETTI_SHAPES = ['circle','square','triangle','diamond'];
  function buatConfetti() {
    const wrap = document.getElementById('confetti-wrap');
    wrap.innerHTML = '';
    for (let i = 0; i < 80; i++) {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      const color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
      const size = 6 + Math.random() * 10;
      el.style.left = Math.random() * 100 + '%';
      el.style.background = color;
      el.style.width = size + 'px';
      el.style.height = size + (Math.random() > 0.5 ? 'px' : `px`);
      // random shape
      const shape = Math.random();
      if (shape < 0.33) el.style.borderRadius = '50%';
      else if (shape < 0.66) el.style.borderRadius = '2px';
      else { el.style.width = '0'; el.style.height = '0'; el.style.background = 'none'; el.style.borderLeft = `${size/2}px solid transparent`; el.style.borderRight = `${size/2}px solid transparent`; el.style.borderBottom = `${size}px solid ${color}`; }
      // slight horizontal drift
      const drift = (Math.random() - 0.5) * 120;
      el.style.setProperty('--drift', drift + 'px');
      const dur = 1.4 + Math.random() * 2;
      const delay = Math.random() * 0.6;
      el.style.animation = `confettiFall3d ${dur}s ${delay}s linear forwards`;
      // apply drift via transform offset using keyframe override
      el.style.marginLeft = drift + 'px';
      wrap.appendChild(el);
    }
  }
  function bersihkanConfetti() {
    document.getElementById('confetti-wrap').innerHTML = '';
  }

  // 3D tilt on success card follow mouse
  document.addEventListener('mousemove', function(e) {
    const card = document.getElementById('success-card');
    if (!card || !document.getElementById('success-overlay').classList.contains('show')) return;
    const rect = card.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const dx = (e.clientX - cx) / (rect.width / 2);
    const dy = (e.clientY - cy) / (rect.height / 2);
    const rotX = -dy * 12;
    const rotY = dx * 12;
    card.style.transform = `perspective(900px) rotateX(${rotX}deg) rotateY(${rotY}deg) scale(1.02)`;
  });
  document.getElementById('success-overlay') && document.addEventListener('mouseleave', function() {
    const card = document.getElementById('success-card');
    if (card) card.style.transform = 'perspective(900px) rotateX(0) rotateY(0) scale(1)';
  });

  // Shake btn on validation error
  const origShowToast = showToast;

  document.getElementById('overlay').addEventListener('click', function(e) {
    if (e.target === this) tutupLogin();
  });
</script>

<!-- SUCCESS OVERLAY 3D -->

  <div class="scene-3d">
    <div class="success-card" id="success-card" onclick="event.stopPropagation()">
      <span class="big-icon-wrap"><span class="big-icon">🧋</span></span>
      <h3>Pesanan Dicatat!</h3>
      <div class="order-info" id="success-info"></div>
      <div class="xp-row">
        <span class="xp-badge">⚡ +10 XP</span>
        <span class="streak-badge" id="streak-badge">🔥 1x</span>
      </div>
      <button class="btn-ok" onclick="tutupSuccess()">Siap! 🎉</button>
    </div>
  </div>
</div>
<div class="confetti-wrap" id="confetti-wrap"></div>

</body>
</html>
