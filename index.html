<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Minuman · DPRKP Ngawi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07090f;
  --surface: #0f111a;
  --card: #161824;
  --card2: #1c1f30;
  --border: #222536;
  --accent: #3ded8c;
  --accent2: #22c55e;
  --accent-dim: rgba(61,237,140,0.1);
  --accent-glow: rgba(61,237,140,0.25);
  --text: #e8eaf6;
  --muted: #5c607d;
  --muted2: #8890b0;
  --danger: #ff5f5f;
  --warn: #ffd166;
  --input-bg: #0b0d15;
  --r: 14px; --r-sm: 10px;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family:'Plus Jakarta Sans',sans-serif;
  background:var(--bg); color:var(--text);
  min-height:100vh; padding-bottom:100px;
  background-image:
    radial-gradient(ellipse 80% 50% at 20% -10%, rgba(61,237,140,0.05) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 110%, rgba(56,130,240,0.04) 0%, transparent 60%);
}

/* TOPBAR */
.topbar {
  background:rgba(15,17,26,0.88);
  backdrop-filter:blur(20px) saturate(1.6);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:14px 20px;
  display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:50;
}
.brand { display:flex; align-items:center; gap:11px; }
.brand-icon {
  width:38px; height:38px;
  background:var(--accent-dim);
  border:1px solid rgba(61,237,140,0.2);
  border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  font-size:1.3rem;
}
.brand h1 {
  font-size:0.9rem; font-weight:800; letter-spacing:-0.4px; line-height:1.1;
  background:linear-gradient(135deg,var(--text) 40%,var(--accent));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.brand p { font-size:0.67rem; color:var(--muted); margin-top:1px; }

.btn-rekap {
  background:var(--card); border:1px solid var(--border);
  border-radius:50px; color:var(--muted2);
  font-family:inherit; font-size:0.75rem; font-weight:700;
  padding:8px 16px; cursor:pointer;
  display:flex; align-items:center; gap:7px; transition:all 0.2s;
}
.btn-rekap:hover { border-color:var(--accent); color:var(--accent); }
.btn-rekap.on { background:var(--accent-dim); border-color:rgba(61,237,140,0.3); color:var(--accent); }
.sdot {
  width:7px; height:7px; border-radius:50%;
  background:var(--muted); transition:all 0.3s; flex-shrink:0;
}
.btn-rekap.on .sdot {
  background:var(--accent); box-shadow:0 0 8px var(--accent);
  animation:pdot 2s infinite;
}
@keyframes pdot { 0%,100%{box-shadow:0 0 4px var(--accent)} 50%{box-shadow:0 0 12px var(--accent)} }

/* FORM */
.form-wrap { max-width:420px; margin:0 auto; padding:20px 16px 0; }
.form-card {
  background:var(--card); border:1px solid var(--border);
  border-radius:20px; padding:24px 20px; margin-bottom:14px;
  box-shadow:0 4px 40px rgba(0,0,0,0.3);
  transition:transform 0.3s, box-shadow 0.3s;
}
.form-card:hover {
  transform:translateY(-2px);
  box-shadow:0 10px 50px rgba(0,0,0,0.4),0 0 0 1px rgba(61,237,140,0.05);
}
.card-label {
  font-size:0.68rem; font-weight:800; text-transform:uppercase;
  letter-spacing:1.2px; color:var(--accent); margin-bottom:18px;
  display:flex; align-items:center; gap:8px;
}
.card-label::before {
  content:''; display:inline-block;
  width:3px; height:14px; background:var(--accent);
  border-radius:2px; box-shadow:0 0 8px var(--accent);
}
.field { margin-bottom:13px; }
label {
  display:block; font-size:0.68rem; font-weight:800;
  color:var(--muted); text-transform:uppercase; letter-spacing:0.9px; margin-bottom:7px;
}
.ib {
  width:100%; background:var(--input-bg);
  border:1.5px solid var(--border); border-radius:var(--r-sm);
  color:var(--text); font-family:inherit; font-size:0.9rem;
  padding:12px 14px; outline:none; appearance:none; -webkit-appearance:none;
  transition:border-color 0.2s, box-shadow 0.2s, transform 0.15s;
}
.ib:focus {
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-dim),0 2px 12px rgba(0,0,0,0.3);
  transform:translateY(-1px);
}
.sw { position:relative; }
.sw::after {
  content:'▾'; position:absolute; right:14px; top:50%;
  transform:translateY(-50%); color:var(--muted); pointer-events:none;
}
.sw select { padding-right:36px; cursor:pointer; }
input[type=number] {
  width:100%; background:var(--input-bg);
  border:1.5px solid var(--border); border-radius:var(--r-sm);
  color:var(--text); font-family:inherit; font-size:1rem; font-weight:700;
  padding:12px 14px; outline:none; text-align:center;
  transition:border-color 0.2s, box-shadow 0.2s;
  -moz-appearance:textfield;
}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button { -webkit-appearance:none; }
input[type=number]:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim); }
.qty-row { display:flex; gap:8px; align-items:center; }
.qb {
  width:48px; height:48px; flex-shrink:0;
  background:var(--card2); border:1.5px solid var(--border);
  border-radius:var(--r-sm); color:var(--text); font-size:1.4rem;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:all 0.15s; user-select:none;
}
.qb:hover { background:var(--accent); color:#07090f; border-color:var(--accent); transform:scale(1.08); box-shadow:0 4px 16px var(--accent-glow); }
.qb:active { transform:scale(0.92); }

/* SUBMIT */
.btn-sub {
  width:100%; padding:16px;
  background:linear-gradient(135deg,var(--accent) 0%,#2dd472 100%);
  color:#07090f; border:none; border-radius:var(--r);
  font-family:inherit; font-size:0.95rem; font-weight:900;
  cursor:pointer; letter-spacing:-0.3px; position:relative; overflow:hidden;
  box-shadow:0 4px 24px var(--accent-glow),0 2px 0 rgba(0,0,0,0.2);
  transition:all 0.2s;
}
.btn-sub::before {
  content:''; position:absolute; inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.15) 0%,transparent 60%);
  pointer-events:none;
}
.btn-sub:hover:not(:disabled) { transform:translateY(-2px) scale(1.01); box-shadow:0 8px 32px var(--accent-glow); }
.btn-sub:active:not(:disabled) { transform:scale(0.97) translateY(1px); }
.btn-sub:disabled { opacity:0.45; cursor:not-allowed; transform:none; box-shadow:none; }
.sp { display:inline-block; width:16px; height:16px; border:2px solid rgba(7,9,15,0.3); border-top-color:#07090f; border-radius:50%; animation:spin 0.7s linear infinite; vertical-align:middle; margin-right:8px; }
@keyframes spin { to { transform:rotate(360deg); } }

/* REKAP PANEL */
.rekap-panel {
  position:fixed; inset:0; background:var(--bg);
  z-index:100; display:none; flex-direction:column; overflow:hidden;
  transform:translateX(100%);
  transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);
}
.rekap-panel.show { display:flex; transform:translateX(0); }
.rkbar {
  background:rgba(15,17,26,0.9); backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border); padding:14px 20px;
  display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
}
.rkbar h2 { font-size:0.95rem; font-weight:800; }
.rkbar-acts { display:flex; gap:8px; }
.bi {
  background:var(--card); border:1px solid var(--border); color:var(--accent);
  border-radius:var(--r-sm); font-family:inherit; font-size:0.75rem; font-weight:700;
  padding:8px 14px; cursor:pointer; display:flex; align-items:center; gap:6px; transition:all 0.2s;
}
.bi:hover { border-color:var(--accent); background:var(--accent-dim); }
.bc {
  background:none; border:1px solid var(--border); color:var(--muted2);
  border-radius:var(--r-sm); font-family:inherit; font-size:0.75rem; font-weight:600;
  padding:8px 14px; cursor:pointer; transition:all 0.2s;
}
.bc:hover { border-color:var(--danger); color:var(--danger); }
.rkscroll { flex:1; overflow-y:auto; padding:16px; }
.rkin { max-width:420px; margin:0 auto; }
.bblock { margin-bottom:20px; }
.bhead {
  background:linear-gradient(135deg,var(--accent),#2dd472);
  padding:13px 18px; border-radius:var(--r) var(--r) 0 0;
  display:flex; justify-content:space-between; align-items:center;
}
.bhead span { font-size:0.85rem; font-weight:800; color:#07090f; }
.bbody { background:var(--card); border:1px solid var(--border); border-top:none; border-radius:0 0 var(--r) var(--r); overflow:hidden; }
.prow { border-bottom:1px solid var(--border); cursor:pointer; }
.prow:last-child { border-bottom:none; }
.psum { display:flex; justify-content:space-between; align-items:center; padding:14px 18px; transition:background 0.15s; }
.prow:hover .psum { background:var(--input-bg); }
.psn { font-size:0.88rem; font-weight:700; }
.psm { font-size:0.72rem; color:var(--muted); margin-top:2px; }
.pst { font-size:0.92rem; font-weight:800; color:var(--accent); }
.parr { font-size:0.62rem; color:var(--muted); display:block; text-align:right; margin-top:3px; transition:transform 0.25s; }
.prow.open .parr { transform:rotate(180deg); }
.porders { display:none; background:var(--bg); border-top:1px solid var(--border); padding:10px; flex-direction:column; gap:8px; }
.prow.open .porders { display:flex; }
.ocard { background:var(--card2); border:1px solid var(--border); border-radius:var(--r-sm); padding:10px 14px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
.ocn { font-size:0.84rem; font-weight:600; }
.ocm { font-size:0.71rem; color:var(--muted); margin-top:3px; }
.ocq { display:inline-block; background:var(--border); border-radius:4px; padding:1px 6px; font-size:0.68rem; color:var(--text); margin-right:4px; }
.ocp { font-size:0.88rem; font-weight:700; color:var(--accent); flex-shrink:0; }
.ocp.dash { color:var(--muted); font-weight:400; font-size:0.78rem; }

/* TOAST */
.toast {
  position:fixed; bottom:24px; left:50%;
  transform:translateX(-50%) translateY(100px);
  background:var(--card2); border:1px solid var(--border); color:var(--text);
  padding:12px 24px; border-radius:50px; font-size:0.82rem; font-weight:700;
  transition:transform 0.35s cubic-bezier(0.34,1.4,0.64,1);
  z-index:9999; white-space:nowrap; pointer-events:none;
  box-shadow:0 8px 32px rgba(0,0,0,0.4);
}
.toast.show { transform:translateX(-50%) translateY(0); }
.toast.ok { background:var(--accent-dim); border-color:rgba(61,237,140,0.3); color:var(--accent); }
.toast.err { background:rgba(255,95,95,0.1); border-color:rgba(255,95,95,0.3); color:var(--danger); }

/* LOGIN */
.overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0);
  display:none; align-items:center; justify-content:center;
  z-index:200; padding:24px; transition:background 0.3s;
}
.overlay.show { display:flex; background:rgba(0,0,0,0.82); backdrop-filter:blur(14px); }
.lbox {
  background:var(--card); border:1px solid var(--border);
  border-radius:22px; padding:34px 26px;
  width:100%; max-width:320px; text-align:center;
  box-shadow:0 24px 80px rgba(0,0,0,0.5);
  animation:slideUp 0.35s cubic-bezier(0.34,1.4,0.64,1) both;
}
@keyframes slideUp { from { transform:translateY(40px) scale(0.95); opacity:0; } }
.lico { font-size:2.2rem; display:block; margin-bottom:12px; }
.lbox h2 { font-size:1.05rem; font-weight:800; margin-bottom:5px; }
.lbox p { font-size:0.78rem; color:var(--muted); margin-bottom:22px; }
.pww { position:relative; margin-bottom:12px; }
.pww input {
  width:100%; background:var(--input-bg);
  border:1.5px solid var(--border); border-radius:var(--r-sm);
  color:var(--text); font-family:inherit;
  font-size:1.05rem; padding:13px 46px 13px 16px;
  outline:none; letter-spacing:4px;
  transition:border-color 0.2s, box-shadow 0.2s;
}
.pww input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim); }
.pww input::placeholder { letter-spacing:1px; font-size:0.9rem; }
.pweye { position:absolute; right:13px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--muted); display:flex; align-items:center; }
.bprimary {
  width:100%; padding:13px;
  background:linear-gradient(135deg,var(--accent),#2dd472);
  color:#07090f; border:none; border-radius:var(--r-sm);
  font-family:inherit; font-size:0.9rem; font-weight:900;
  cursor:pointer; transition:all 0.2s;
  box-shadow:0 4px 16px var(--accent-glow);
}
.bprimary:hover { transform:translateY(-1px); box-shadow:0 8px 24px var(--accent-glow); }
.bdanger {
  width:100%; padding:12px; background:none; color:var(--danger);
  border:1px solid rgba(255,95,95,0.3); border-radius:var(--r-sm);
  font-family:inherit; font-size:0.88rem; font-weight:700;
  cursor:pointer; transition:all 0.2s; margin-top:10px;
}
.bdanger:hover { background:rgba(255,95,95,0.08); border-color:var(--danger); }
.lerr { font-size:0.77rem; color:var(--danger); margin-top:8px; min-height:18px; }
.bghost { background:none; border:none; color:var(--muted); font-family:inherit; font-size:0.77rem; cursor:pointer; margin-top:14px; width:100%; transition:color 0.2s; }
.bghost:hover { color:var(--text); }

/* SUCCESS 3D */
.sov {
  position:fixed; inset:0; z-index:300;
  display:flex; align-items:center; justify-content:center;
  pointer-events:none; background:rgba(0,0,0,0);
  transition:background 0.4s ease;
}
.sov.show { pointer-events:auto; background:rgba(0,5,15,0.82); backdrop-filter:blur(16px) saturate(1.5); }
.sc3d { perspective:1000px; }
.scard {
  background:linear-gradient(160deg,#1a1f35 0%,#111320 50%,#0d1020 100%);
  border:1.5px solid rgba(61,237,140,0.45);
  border-radius:26px; padding:40px 28px 36px;
  text-align:center; max-width:300px; width:90%;
  opacity:0;
  transform:perspective(1000px) rotateX(35deg) scale(0.65) translateY(20px);
  transition:opacity 0.4s ease, transform 0.55s cubic-bezier(0.34,1.46,0.64,1);
  box-shadow:0 40px 100px rgba(0,0,0,0.65),0 0 60px rgba(61,237,140,0.12),inset 0 1px 0 rgba(255,255,255,0.07);
  position:relative; overflow:hidden; will-change:transform,opacity;
}
.scard::before {
  content:''; position:absolute; inset:0;
  background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,0.04) 48%,rgba(255,255,255,0.02) 52%,transparent 70%);
  animation:shim 3.5s ease-in-out infinite 1.2s; pointer-events:none;
}
@keyframes shim { 0%{transform:translateX(-100%)} 100%{transform:translateX(200%)} }
.sov.show .scard { opacity:1; transform:perspective(1000px) rotateX(0deg) scale(1) translateY(0); }
.ico-float {
  display:block; margin:0 auto 14px;
  font-size:3.8rem; line-height:1;
  filter:drop-shadow(0 8px 24px rgba(61,237,140,0.45));
  animation:flt 3.5s ease-in-out infinite; will-change:transform;
}
@keyframes flt {
  0%,100%{ transform:translateY(0) rotateY(0deg) rotateZ(0deg); }
  33%    { transform:translateY(-10px) rotateY(18deg) rotateZ(3deg); }
  66%    { transform:translateY(-6px) rotateY(-12deg) rotateZ(-2deg); }
}
.scard h3 {
  font-size:1.2rem; font-weight:900;
  background:linear-gradient(135deg,var(--accent) 20%,#a8ffcc);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  margin-bottom:10px;
  animation:popIn 0.45s 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
}
.oann {
  font-size:0.9rem; line-height:1.65;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:12px; padding:13px 15px; margin:0 0 4px;
  animation:popIn 0.45s 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
}
.ann-name { color:var(--accent); font-weight:800; font-size:1rem; display:block; margin-bottom:3px; }
.ann-item { color:var(--muted2); font-weight:500; }
.ann-item strong { color:var(--text); font-weight:700; }
.xpr { display:flex; justify-content:center; gap:8px; margin-top:16px; }
.xpb {
  display:inline-flex; align-items:center; gap:5px;
  background:linear-gradient(135deg,var(--accent),#2dd472);
  color:#07090f; font-size:0.77rem; font-weight:800;
  padding:6px 14px; border-radius:50px; box-shadow:0 4px 16px var(--accent-glow);
  animation:pop3d 0.5s 0.55s cubic-bezier(0.34,1.56,0.64,1) both;
}
.stb {
  display:inline-flex; align-items:center; gap:5px;
  background:rgba(255,209,102,0.1); border:1px solid rgba(255,209,102,0.25);
  color:var(--warn); font-size:0.77rem; font-weight:800;
  padding:6px 14px; border-radius:50px;
  animation:pop3d 0.5s 0.7s cubic-bezier(0.34,1.56,0.64,1) both;
}
.bok {
  margin-top:22px; padding:13px 40px;
  background:linear-gradient(135deg,var(--accent) 0%,#2dd472 100%);
  color:#07090f; border:none; border-radius:50px;
  font-family:inherit; font-size:0.92rem; font-weight:900;
  cursor:pointer;
  box-shadow:0 6px 20px var(--accent-glow),0 2px 0 rgba(0,0,0,0.25);
  transition:all 0.2s;
  animation:pop3d 0.5s 0.85s cubic-bezier(0.34,1.56,0.64,1) both;
}
.bok:hover { transform:translateY(-3px) scale(1.06); box-shadow:0 12px 32px var(--accent-glow); }
.bok:active { transform:scale(0.96); }
@keyframes popIn { from{opacity:0;transform:scale(0.7) translateY(12px)} to{opacity:1;transform:scale(1) translateY(0)} }
@keyframes pop3d { from{opacity:0;transform:scale(0) perspective(400px) rotateX(-50deg)} to{opacity:1;transform:scale(1) perspective(400px) rotateX(0deg)} }

/* CONFETTI */
#cfw { position:fixed; inset:0; pointer-events:none; z-index:299; overflow:hidden; }
.c { position:absolute; animation:cfall linear forwards; will-change:transform,opacity; }
@keyframes cfall {
  0%   { transform:translateY(-20px) rotateX(0) rotateY(0) rotateZ(0); opacity:1; }
  15%  { opacity:1; }
  100% { transform:translateY(108vh) rotateX(600deg) rotateY(400deg) rotateZ(360deg); opacity:0; }
}
@keyframes shake {
  0%,100%{ transform:translateX(0); }
  15%    { transform:translateX(-7px) rotateZ(-1deg); }
  35%    { transform:translateX(7px) rotateZ(1deg); }
  55%    { transform:translateX(-4px); }
  75%    { transform:translateX(4px); }
}
.shake { animation:shake 0.45s ease; }
.empty { text-align:center; color:var(--muted); font-size:0.85rem; padding:48px 0; }
.loading { text-align:center; color:var(--muted); font-size:0.85rem; padding:48px 0; animation:lp 1.4s ease-in-out infinite; }
@keyframes lp { 0%,100%{opacity:1} 50%{opacity:0.25} }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-icon">🧋</div>
    <div>
      <h1>Order Minuman</h1>
      <p>Bidang Perumahan · DPRKP Ngawi</p>
    </div>
  </div>
  <button class="btn-rekap" id="btn-rekap" onclick="bukaLogin()">
    <span class="sdot" id="sdot"></span>
    <span id="rlbl">Rekap</span>
  </button>
</div>

<div class="form-wrap">
  <div class="form-card">
    <div class="card-label">Catat Pesanan</div>
    <div class="field">
      <label>Nama</label>
      <div class="sw">
        <select id="nama" class="ib">
          <option value="">— Pilih Nama —</option>
          <option>Bu Tiwi</option><option>Bu Etiek</option><option>Bu Yuni</option>
          <option>Pak Wahyudhi</option><option>Mas Dika</option><option>Mas Hari</option>
          <option>Mbak Reza</option><option>Fauzi</option><option>Aca</option>
          <option>Erma</option><option>Mbak Dian</option><option>Mbak Riri</option>
          <option>Mas Yunan</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Minuman</label>
      <div class="sw">
        <select id="minuman" class="ib" onchange="onMin()">
          <option value="">— Pilih Minuman —</option>
          <option>Es Teh</option><option>Teh Hangat</option><option>Kopi</option>
          <option>Es Jeruk</option><option>Jeruk Anget</option><option>Cappucino</option>
          <option>Good Day</option><option>Kerupuk</option><option>Gorengan</option>
          <option value="Lainnya">Lainnya...</option>
        </select>
      </div>
      <div id="lain-w" style="display:none;margin-top:8px">
        <input type="text" id="minuman-lain" class="ib" placeholder="Tulis nama minuman...">
      </div>
    </div>
    <div class="field">
      <label>Jumlah</label>
      <div class="qty-row">
        <button class="qb" onclick="ubahQty(-1)" type="button">−</button>
        <input type="number" id="jumlah" value="1" min="1" max="99">
        <button class="qb" onclick="ubahQty(1)" type="button">+</button>
      </div>
    </div>
    <div class="field">
      <label>Tanggal</label>
      <input type="date" id="tanggal" class="ib">
    </div>
  </div>
  <button class="btn-sub" id="bsub" onclick="submit()">Catat Pesanan 🧋</button>
</div>

<!-- REKAP PANEL -->
<div class="rekap-panel" id="rpanel">
  <div class="rkbar">
    <h2>📊 Rekap Order</h2>
    <div class="rkbar-acts">
      <button class="bi" onclick="exportCSV()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export
      </button>
      <button class="bc" onclick="tutupRekap()">✕ Tutup</button>
    </div>
  </div>
  <div class="rkscroll">
    <div class="rkin" id="rroot"><div class="loading">Memuat...</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- LOGIN -->
<div class="overlay" id="overlay" onclick="oclick(event)">
  <div class="lbox">
    <span class="lico" id="lico">🔒</span>
    <h2 id="ltitle">Akses Rekap</h2>
    <p id="ldesc">Masukkan password untuk lihat rekap</p>
    <div id="lform">
      <div class="pww">
        <input type="password" id="pwin" placeholder="Password..." onkeydown="if(event.key==='Enter')doLogin()">
        <button class="pweye" type="button" onclick="togglePw()">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <button class="bprimary" onclick="doLogin()">Masuk</button>
      <div class="lerr" id="lerr"></div>
    </div>
    <div id="lwrap" style="display:none">
      <button class="bprimary" onclick="bukaRekap()">Lihat Rekap</button>
      <button class="bdanger" onclick="doLogout()">Keluar</button>
    </div>
    <button class="bghost" onclick="tutupLogin()">Tutup</button>
  </div>
</div>

<!-- SUCCESS 3D -->
<div class="sov" id="sov" onclick="tutupSukses()">
  <div class="sc3d">
    <div class="scard" id="scard" onclick="event.stopPropagation()">
      <span class="ico-float">🧋</span>
      <h3>Pesanan Dicatat!</h3>
      <div class="oann">
        <span class="ann-name" id="ann-nama"></span>
        <span class="ann-item" id="ann-item"></span>
      </div>
      <div class="xpr">
        <span class="xpb">⚡ +10 XP</span>
        <span class="stb" id="stbadge">🔥 1×</span>
      </div>
      <button class="bok" onclick="tutupSukses()">Siap! 🎉</button>
    </div>
  </div>
</div>
<div id="cfw"></div>

<script>
'use strict';
const PW      = 'dprkp2026';
const GAS     = 'https://script.google.com/macros/s/AKfycbzTWqt-W_aE85P4fezj0iIfBiSxK42s5Rg1nzCKD0GD-qpAqHO0lj3Nhgftr8fDAuWW/exec';
const BULAN   = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const HARGA   = {'Es Teh':3000,'Teh Hangat':3000,'Kopi':4000,'Es Jeruk':4000,'Jeruk Anget':4000,'Cappucino':5000,'Good Day':5000,'Kerupuk':1000,'Gorengan':1000};
const COLORS  = ['#3ded8c','#ffd166','#ff5f5f','#a78bfa','#38bdf8','#fb923c','#f472b6','#22d3ee','#34d399'];

let loggedIn = false, cache = null, streak = 0, cfTimer = null, voices = [];

const $ = id => document.getElementById(id);
const rp = n => n ? 'Rp ' + Number(n).toLocaleString('id-ID') : '—';

// Init
$('tanggal').value = new Date().toISOString().slice(0,10);
if (window.speechSynthesis) {
  voices = speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => { voices = speechSynthesis.getVoices(); };
}

// Toast
function toast(msg, type='ok') {
  const t = $('toast');
  t.textContent = msg; t.className = 'toast ' + type + ' show';
  clearTimeout(t._t); t._t = setTimeout(() => t.className='toast', 3000);
}

// Form
function onMin() {
  $('lain-w').style.display = $('minuman').value === 'Lainnya' ? 'block' : 'none';
}
function ubahQty(d) {
  const el = $('jumlah');
  el.value = Math.max(1, (parseInt(el.value)||1) + d);
}

async function submit() {
  const nama    = $('nama').value;
  const sel     = $('minuman').value;
  const lain    = $('minuman-lain').value.trim();
  const tanggal = $('tanggal').value;
  const jumlah  = parseInt($('jumlah').value)||1;
  const minuman = sel === 'Lainnya' ? lain : sel;
  const harga   = HARGA[minuman]||'';
  const total   = harga ? harga*jumlah : '';

  if (!nama||!minuman||!tanggal) {
    const b=$('bsub'); b.classList.add('shake');
    setTimeout(()=>b.classList.remove('shake'),500);
    toast('⚠️ Lengkapi semua field dulu','err'); return;
  }

  const btn = $('bsub');
  btn.disabled = true;
  btn.innerHTML = '<span class="sp"></span>Mengirim...';

  try {
    await fetch(GAS, {
      method:'POST', mode:'no-cors',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({tanggal,nama,minuman,jumlah,harga,total})
    });
    $('nama').value=''; $('minuman').value=''; $('minuman-lain').value='';
    $('jumlah').value='1'; $('tanggal').value=new Date().toISOString().slice(0,10);
    $('lain-w').style.display='none'; cache=null;
    tampilSukses(nama,minuman,jumlah);
  } catch(e) {
    toast('❌ Gagal kirim, coba lagi','err');
  }

  btn.disabled=false; btn.innerHTML='Catat Pesanan 🧋';
}

// Success effect
function tampilSukses(nama, minuman, jumlah) {
  streak++;
  $('ann-nama').textContent  = nama;
  $('ann-item').innerHTML    = `memesan <strong>${jumlah>1?jumlah+'× ':''} ${minuman}</strong>`;
  $('stbadge').textContent   = `🔥 ${streak}×`;
  $('sov').classList.add('show');
  spawnConfetti();
  speak(nama, minuman, jumlah);
}

function tutupSukses() {
  $('sov').classList.remove('show');
  stopConfetti();
  if (window.speechSynthesis) speechSynthesis.cancel();
}

// TTS — reads name + order
function speak(nama, minuman, jumlah) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const qty  = jumlah > 1 ? `${jumlah} ` : '';
  const text = `Pesanan dicatat. ${nama} memesan ${qty}${minuman}.`;
  const utt  = new SpeechSynthesisUtterance(text);
  utt.lang   = 'id-ID'; utt.rate=0.9; utt.pitch=1.05; utt.volume=1;
  const v = voices.find(v=>v.lang.startsWith('id')) || voices.find(v=>v.lang.startsWith('ms'));
  if (v) utt.voice = v;
  speechSynthesis.speak(utt);
}

// Confetti — DocumentFragment batch for perf
function spawnConfetti() {
  stopConfetti();
  const wrap = $('cfw'); wrap.innerHTML='';
  const f = document.createDocumentFragment();
  for (let i=0;i<70;i++) {
    const el = document.createElement('div');
    el.className='c';
    const color = COLORS[i%COLORS.length];
    const size  = 6+Math.random()*10;
    const dur   = 1.3+Math.random()*1.8;
    const delay = Math.random()*0.5;
    const drift = (Math.random()-.5)*90;
    el.style.cssText=`left:${Math.random()*100}%;width:${size}px;height:${size}px;background:${color};border-radius:${Math.random()>.5?'50%':'3px'};animation:cfall ${dur}s ${delay}s linear forwards;margin-left:${drift}px;`;
    f.appendChild(el);
  }
  wrap.appendChild(f);
  cfTimer=setTimeout(()=>{wrap.innerHTML=''},3200);
}
function stopConfetti() { clearTimeout(cfTimer); $('cfw').innerHTML=''; }

// 3D tilt on mouse
document.addEventListener('mousemove', e => {
  if (!$('sov').classList.contains('show')) return;
  const c=$('scard'), r=c.getBoundingClientRect();
  const dx=((e.clientX-r.left)/r.width-.5)*2;
  const dy=((e.clientY-r.top)/r.height-.5)*2;
  c.style.transform=`perspective(1000px) rotateX(${-dy*10}deg) rotateY(${dx*10}deg) scale(1.02)`;
},{passive:true});

// Login
function bukaLogin() {
  if (loggedIn) {
    $('lico').textContent='🔓'; $('ltitle').textContent='Sudah Login';
    $('ldesc').textContent='Akses rekap atau keluar';
    $('lform').style.display='none'; $('lwrap').style.display='block';
  } else {
    $('lico').textContent='🔒'; $('ltitle').textContent='Akses Rekap';
    $('ldesc').textContent='Masukkan password untuk lihat rekap';
    $('lform').style.display='block'; $('lwrap').style.display='none';
    setTimeout(()=>$('pwin').focus(),120);
  }
  $('overlay').classList.add('show');
}
function tutupLogin() { $('overlay').classList.remove('show'); $('pwin').value=''; $('lerr').textContent=''; }
function oclick(e) { if(e.target===$('overlay'))tutupLogin(); }
function togglePw() { const el=$('pwin'); el.type=el.type==='password'?'text':'password'; }
function doLogin() {
  if ($('pwin').value===PW) {
    loggedIn=true; $('btn-rekap').classList.add('on'); $('rlbl').textContent='Rekap ✓';
    tutupLogin(); bukaRekap();
  } else {
    $('lerr').textContent='❌ Password salah'; $('pwin').value=''; $('pwin').focus();
  }
}
function doLogout() {
  loggedIn=false; cache=null;
  $('btn-rekap').classList.remove('on'); $('rlbl').textContent='Rekap';
  tutupLogin(); tutupRekap();
}

// Rekap
function bukaRekap() { if(!loggedIn){bukaLogin();return;} tutupLogin(); $('rpanel').classList.add('show'); loadRekap(); }
function tutupRekap() { $('rpanel').classList.remove('show'); }

async function loadRekap() {
  if (cache) { renderRekap(); return; }
  $('rroot').innerHTML='<div class="loading">Memuat data...</div>';
  try {
    cache = await (await fetch(GAS)).json();
    renderRekap();
  } catch { $('rroot').innerHTML='<div class="empty">⚠️ Gagal memuat</div>'; }
}

function renderRekap() {
  if (!cache?.length) { $('rroot').innerHTML='<div class="empty">Belum ada data</div>'; return; }
  const byM={};
  for (const r of cache) {
    if (!r.Tanggal) continue;
    const d=new Date(r.Tanggal); if(isNaN(d)) continue;
    const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    (byM[k]=byM[k]||[]).push(r);
  }
  const frag=document.createDocumentFragment();
  for (const key of Object.keys(byM).sort().reverse()) {
    const [y,m]=key.split('-');
    const rows=byM[key], byP={};
    let gt=0;
    for (const r of rows) {
      const n=r.Nama||'?';
      if (!byP[n]) byP[n]={total:0,orders:[]};
      const t=Number(r.Total)||0; byP[n].total+=t; byP[n].orders.push(r); gt+=t;
    }
    const blk=document.createElement('div'); blk.className='bblock';
    blk.innerHTML=`<div class="bhead"><span>📅 ${BULAN[+m-1]} ${y}</span><span>${gt>0?rp(gt):'—'}</span></div><div class="bbody" id="bb-${key}"></div>`;
    frag.appendChild(blk);
    const body=blk.querySelector('.bbody');
    let i=0;
    for (const [n,d] of Object.entries(byP).sort((a,b)=>b[1].total-a[1].total)) {
      const pid=`pr-${key}-${i++}`;
      const to=d.orders.length, ti=d.orders.reduce((s,r)=>s+(Number(r.Jumlah)||1),0);
      const pr=document.createElement('div'); pr.className='prow'; pr.id=pid;
      pr.onclick=()=>pr.classList.toggle('open');
      pr.innerHTML=`<div class="psum"><div><div class="psn">${n}</div><div class="psm">${to} order · ${ti} item</div></div><div style="text-align:right"><div class="pst">${d.total>0?rp(d.total):'—'}</div><span class="parr">▾</span></div></div><div class="porders">${
        [...d.orders].reverse().map(r=>{
          const d2=new Date(r.Tanggal);
          const tgl=isNaN(d2)?'—':d2.toLocaleDateString('id-ID',{day:'numeric',month:'short'});
          const jml=Number(r.Jumlah)||1, tot=Number(r.Total);
          return `<div class="ocard"><div><div class="ocn">🧋 ${r.Minuman||'—'}</div><div class="ocm">${jml>1?`<span class="ocq">✕${jml}</span>`:''}📅 ${tgl}</div></div><div class="ocp${!tot?' dash':''}">${tot?rp(tot):'—'}</div></div>`;
        }).join('')
      }</div>`;
      body.appendChild(pr);
    }
  }
  const root=$('rroot'); root.innerHTML=''; root.appendChild(frag);
}

function exportCSV() {
  if (!cache?.length) { toast('Belum ada data','err'); return; }
  const rows=[['Tanggal','Nama','Minuman','Jumlah','Harga','Total'],...cache.map(r=>[r.Tanggal||'',r.Nama||'',r.Minuman||'',r.Jumlah||'',r.Harga||'',r.Total||''])];
  const csv='\uFEFF'+rows.map(r=>r.map(v=>{const s=String(v);return s.includes(',')||s.includes('"')?`"${s.replace(/"/g,'""')}"`:s;}).join(',')).join('\n');
  const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'})),download:`rekap-${new Date().toISOString().slice(0,10).replace(/-/g,'')}.csv`});
  a.click(); URL.revokeObjectURL(a.href); toast('✅ File diunduh!');
}
</script>
</body>
</html>
